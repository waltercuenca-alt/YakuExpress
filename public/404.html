<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var githubPagesBase = '/YakuExpress/';
        var isGitHubPages = location.hostname.endsWith('github.io');

        if (isGitHubPages) {
          sessionStorage.redirect = location.href;
          location.replace(githubPagesBase);
        }
      })();
    </script>
  </head>
  <body></body>
</html>
